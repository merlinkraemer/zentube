<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 200px;
      padding: 16px;
      background: #1C2026;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: #e3e3e3;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title svg { width: 18px; height: 18px; }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      cursor: pointer;
    }
    .toggle input { display: none; }
    .track {
      position: absolute;
      inset: 0;
      background: #555;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .toggle input:checked + .track { background: #3ea6ff; }
    .thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked ~ .thumb { transform: translateX(16px); }
  </style>
</head>
<body>
  <div class="header">
    <span class="title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="2 6 44 36"><defs><mask id="m"><rect x="2" y="6" width="44" height="36" fill="white"/><polygon points="20,17 20,31 32,24" fill="black"/></mask></defs><path fill="white" d="M43.2,33.9c-0.4,2.1-2.1,3.7-4.2,4c-3.3,0.5-8.8,1.1-15,1.1c-6.1,0-11.6-0.6-15-1.1c-2.1-0.3-3.8-1.9-4.2-4C4.4,31.6,4,28.2,4,24c0-4.2,0.4-7.6,0.8-9.9c0.4-2.1,2.1-3.7,4.2-4C12.3,9.6,17.8,9,24,9c6.2,0,11.6,0.6,15,1.1c2.1,0.3,3.8,1.9,4.2,4c0.4,2.3,0.9,5.7,0.9,9.9C44,28.2,43.6,31.6,43.2,33.9z" mask="url(#m)"/></svg> ZenTube</span>
    <label class="toggle">
      <input type="checkbox" id="toggle">
      <div class="track"></div>
      <div class="thumb"></div>
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
